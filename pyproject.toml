[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmc"
version = "0.1.0"
description = "Latent thinking-window compression experiment infrastructure"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
runtime = ["torch>=2.4", "transformers>=4.56", "safetensors>=0.4"]

[project.scripts]
lmc = "lmc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
